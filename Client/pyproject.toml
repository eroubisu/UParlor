[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uparlor"
version = "0.4.4"
description = "UParlor — 终端游戏厅 TUI 客户端"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "textual>=8.1",
    "rich>=13.3",
    "regex>=2024.11",
    "google-genai>=1.0",
    "openai>=1.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.15,<0.18",
]
audit = [
    "pylint>=4.0,<5",
    "pytest-cov>=6.0,<8",
    "radon>=6.0,<7",
    "vulture>=2.14,<3",
]

[project.scripts]
uparlor = "client.app:main"

[tool.setuptools.packages.find]
include = ["client*"]

[tool.setuptools.package-data]
client = ["*.tcss", "**/*.json"]
