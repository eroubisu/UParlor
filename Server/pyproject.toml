[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uparlor-server"
version = "0.1.3"
requires-python = ">=3.10"
dependencies = [
    "werkzeug",
]

[project.scripts]
uparlor-server = "server:main"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools.package-data]
server = ["**/*.json", "**/*.txt"]
